<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>문의 관리 — PROM RECORD</title><link rel="stylesheet" href="../assets/studio.css"><link rel="stylesheet" href="../assets/fonts.css"><link rel="stylesheet" href="../assets/contact.css"><script src="../assets/contact-config.js"></script><script type="module" src="../assets/contact.js"></script></head><body class="admin-page"><header class="admin-header"><strong>PROM RECORD</strong><a href="../index.html">사이트 보기 ↗</a></header><main class="admin-main"><span class="admin-eyebrow">PROM RECORD / ADMIN</span><h1>문의 관리</h1><form id="inquiry-login" class="admin-login"><label class="admin-field">이메일<input name="email" type="email" autocomplete="username" required></label><label class="admin-field">비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button type="submit" class="admin-primary">로그인</button><p class="admin-note">관리자로 등록된 계정만 문의를 조회할 수 있습니다.</p></form><form id="inquiry-password-setup" class="admin-login" hidden><label class="admin-field">새 비밀번호<input name="new_password" type="password" autocomplete="new-password" minlength="12" required></label><label class="admin-field">비밀번호 확인<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></label><button type="submit" class="admin-primary">비밀번호 설정</button><p class="admin-note">12자 이상으로 설정해주세요. 설정 후 새 비밀번호로 로그인합니다.</p></form><section id="inquiry-panel" hidden><div class="admin-toolbar"><div><p id="inquiry-account" class="admin-account"></p><p id="inquiry-summary" class="admin-summary" aria-live="polite"></p></div><div class="admin-actions"><label>상태<select id="inquiry-filter"><option value="all">전체</option><option value="new">새 문의</option><option value="in_progress">확인 중</option><option value="done">처리 완료</option></select></label><button type="button" id="inquiry-refresh" class="admin-secondary">새로고침</button><button type="button" id="inquiry-logout" class="admin-secondary">로그아웃</button></div></div><div id="inquiry-list" class="inquiry-list"></div><div class="admin-pagination"><button type="button" id="inquiry-prev" class="admin-secondary" disabled>이전</button><span id="inquiry-page"></span><button type="button" id="inquiry-next" class="admin-secondary" disabled>다음</button></div></section><p class="contact-status" data-contact-status role="status" aria-live="polite"></p></main></body></html>
